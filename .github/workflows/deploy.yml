name: Deploy to GitHub Pages

on:
  push:
    branches: ["development"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: spacedelivery/web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
